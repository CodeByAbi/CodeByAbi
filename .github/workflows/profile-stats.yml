name: Update Profile Statistics

on:
  push:
    branches:
      - main
  schedule:
    - cron: "35 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate statistics SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TZ: Asia/Jakarta
        run: node .github/scripts/generate-stats.mjs

      - name: Commit updated statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/stats.svg profile/streak.svg profile/top-langs.svg

          if git diff --cached --quiet; then
            echo "Statistics have not changed."
            exit 0
          fi

          git commit -m "chore: update profile statistics"
          git push